<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧課表 - 教務處即時管理系統</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --primary-dark: #003d80;
            --secondary-color: #e9ecef;
            --border-color: #dee2e6;
            --text-color: #212529;
            --card-bg: #ffffff;
            --accent-bg: #f8f9fa;
            --active-color: #fff3cd;
            --highlight-text: #856404;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; color: var(--text-color); padding: 15px; }

        header { text-align: center; margin-bottom: 15px; }
        h1 { color: var(--primary-color); font-size: 1.8rem; margin-bottom: 5px; }
        .subtitle { font-size: 0.95rem; color: #6c757d; }

        /* 即時狀態卡片 */
        .status-card {
            background: linear-gradient(135deg, #0056b3, #003d80);
            color: white; padding: 12px 20px; border-radius: 10px;
            margin: 0 auto 15px auto; max-width: 1000px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px;
        }
        .status-time { font-size: 1.3rem; font-weight: bold; }
        .status-current { font-size: 1rem; background: rgba(255, 255, 255, 0.2); padding: 5px 12px; border-radius: 15px; }

        /* 教務功能頁籤導覽 */
        .nav-tabs { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn {
            padding: 10px 18px; border: 1px solid var(--border-color); background-color: #fff;
            border-radius: 6px; cursor: pointer; font-weight: bold; color: var(--primary-color); transition: 0.2s;
        }
        .tab-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .tab-content { display: none; max-width: 1000px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .panel-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .panel-card h3 { color: var(--primary-color); margin-bottom: 15px; border-bottom: 2px solid var(--secondary-color); padding-bottom: 8px; }

        /* 表單元素 */
        .form-group { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .form-group label { width: 100px; font-weight: bold; }
        select, input, button { padding: 8px 12px; font-size: 0.95rem; border: 1px solid #ced4da; border-radius: 6px; outline: none; }
        button.btn-primary { background-color: var(--primary-color); color: white; border: none; cursor: pointer; }
        button.btn-primary:hover { background-color: var(--primary-dark); }

        /* 表格與高亮 */
        .class-info { background-color: var(--primary-color); color: white; padding: 12px 20px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; font-weight: bold; }
        .table-container { background-color: var(--card-bg); border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; min-width: 650px; }
        th, td { border: 1px solid var(--border-color); padding: 10px 8px; font-size: 0.9rem; }
        th { background-color: var(--secondary-color); color: #495057; }
        td.period { background-color: var(--accent-bg); font-weight: bold; width: 140px; }
        .time-badge { display: block; font-size: 0.75rem; color: #6c757d; font-weight: normal; }
        
        .active-row { background-color: var(--active-color) !important; }
        .active-cell { background-color: #ffe8a1 !important; font-weight: bold; color: #856404; border: 2px solid #ffe066 !important; }
        .active-tag { display: inline-block; background-color: #d39e00; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }

        /* 調課紀錄列表 */
        .log-list { list-style: none; max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; background: #fafafa; }
        .log-item { padding: 8px 0; border-bottom: 1px dashed #ccc; font-size: 0.9rem; }
        .log-item:last-child { border-bottom: none; }
        .log-time { color: #6c757d; font-size: 0.8rem; }

        @media (max-width: 767px) { .desktop-table { display: none; } }
    </style>
</head>
<body>

    <header>
        <h1>智慧課表管理系統</h1>
        <div class="subtitle">國立東港海事 - 教務處控制台</div>
    </header>

    <!-- 即時時鐘與動態卡片 -->
    <div class="status-card">
        <div class="status-time" id="clock">12:00:00</div>
        <div class="status-current" id="currentPeriodText">讀取中...</div>
    </div>

    <!-- 頁籤選單 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('viewTab')">課表即時查詢</button>
        <button class="tab-btn" onclick="switchTab('swapTab')">教務調課設定</button>
        <button class="tab-btn" onclick="switchTab('classTab')">新建/修改班級</button>
        <button class="tab-btn" onclick="switchTab('settingsTab')">作息修改/調課紀錄</button>
    </div>

    <!-- TAB 1: 課表即時查詢 -->
    <div id="viewTab" class="tab-content active">
        <div class="panel-card" style="padding: 10px; text-align: center;">
            <select id="classSelect" onchange="renderSchedule()"></select>
            <input type="text" id="searchInput" placeholder="搜尋班級或導師..." oninput="filterClasses()">
        </div>

        <div class="table-container">
            <div class="class-info">
                <span id="currentClassName">班級名稱</span>
                <span id="currentTutor">導師：-</span>
            </div>
            <table class="desktop-table">
                <thead>
                    <tr>
                        <th>節次 / 時間</th>
                        <th>星期一</th>
                        <th>星期二</th>
                        <th>星期三</th>
                        <th>星期四</th>
                        <th>星期五</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: 教務調課設定 -->
    <div id="swapTab" class="tab-content">
        <div class="panel-card">
            <h3>教務處線上調課單</h3>
            <p style="color: #6c757d; margin-bottom: 15px; font-size: 0.9rem;">請選擇要進行課程對調的兩個班級、星期與節次：</p>
            
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <!-- 課程 A -->
                <div style="flex: 1; min-width: 280px; background: #f8f9fa; padding: 15px; border-radius: 6px;">
                    <h4 style="color: var(--primary-color); margin-bottom: 10px;">課程 A</h4>
                    <div class="form-group"><label>班級：</label><select id="swapClassA"></select></div>
                    <div class="form-group"><label>星期：</label>
                        <select id="swapDayA">
                            <option value="0">星期一</option><option value="1">星期二</option>
                            <option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option>
                        </select>
                    </div>
                    <div class="form-group"><label>節次：</label>
                        <select id="swapPeriodA">
                            <option value="1">第 1 節</option><option value="2">第 2 節</option><option value="3">第 3 節</option>
                            <option value="4">第 4 節</option><option value="5">第 5 節</option><option value="6">第 6 節</option><option value="7">第 7 節</option>
                        </select>
                    </div>
                </div>

                <!-- 課程 B -->
                <div style="flex: 1; min-width: 280px; background: #f8f9fa; padding: 15px; border-radius: 6px;">
                    <h4 style="color: var(--primary-color); margin-bottom: 10px;">課程 B</h4>
                    <div class="form-group"><label>班級：</label><select id="swapClassB"></select></div>
                    <div class="form-group"><label>星期：</label>
                        <select id="swapDayB">
                            <option value="0">星期一</option><option value="1">星期二</option>
                            <option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option>
                        </select>
                    </div>
                    <div class="form-group"><label>節次：</label>
                        <select id="swapPeriodB">
                            <option value="1">第 1 節</option><option value="2">第 2 節</option><option value="3">第 3 節</option>
                            <option value="4">第 4 節</option><option value="5">第 5 節</option><option value="6">第 6 節</option><option value="7">第 7 節</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>調課事由：</label>
                <input type="text" id="swapReason" placeholder="例如：教師公差調課 / 研習需求" style="flex: 1;">
            </div>
            <button class="btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="handleSwapSubmit()">確認執行調課</button>
        </div>
    </div>

    <!-- TAB 3: 新建/修改班級課表 -->
    <div id="classTab" class="tab-content">
        <div class="panel-card">
            <h3>班級基本設定</h3>
            <div class="form-group">
                <label>班級名稱：</label>
                <input type="text" id="newClassName" placeholder="例如：水三甲">
            </div>
            <div class="form-group">
                <label>導師姓名：</label>
                <input type="text" id="newTutorName" placeholder="例如：王小明">
            </div>
            <button class="btn-primary" onclick="handleClassSubmit()">新增 / 更新班級基本資料</button>
        </div>
    </div>

    <!-- TAB 4: 作息修改與歷史紀錄 -->
    <div id="settingsTab" class="tab-content">
        <div class="panel-card">
            <h3>教務調課歷史紀錄</h3>
            <ul class="log-list" id="logListContainer">
                <!-- 動態繪製調課紀錄 -->
            </ul>
        </div>

        <div class="panel-card">
            <h3>作息時間維護 (東港海事作息)[span_1](start_span)[span_1](end_span)</h3>
            <div id="timeScheduleEditor">
                <!-- 動態繪製作息時間編輯器 -->
            </div>
        </div>
    </div>

    <script src="curriculum.js"></script>
    <script>
        let currentDayIdx = new Date().getDay() - 1;
        let currentPeriodObj = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'settingsTab') renderLogsAndTimeEditor();
        }

        // 時鐘與即時進行課程高亮
        function updateClock() {
            const now = new Date();
            document.getElementById("clock").textContent = `系統時間：${now.toTimeString().split(' ')[0]}`;

            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            currentPeriodObj = null;
            let statusText = "非作息時間 / 放學";

            for (let item of timeSchedule) {
                if (currentTime >= item.start && currentTime < item.end) {
                    currentPeriodObj = item;
                    statusText = (item.type === 'period') ? `目前：第 ${item.period} 節 (${item.start}~${item.end})` : `目前：${item.name} (${item.start}~${item.end})`;
                    break;
                }
            }
            document.getElementById("currentPeriodText").textContent = statusText;
            renderSchedule();
        }

        function populateSelects() {
            const selects = [document.getElementById("classSelect"), document.getElementById("swapClassA"), document.getElementById("swapClassB")];
            selects.forEach(s => s.innerHTML = "");

            for (let className in scheduleData) {
                selects.forEach(s => {
                    let opt = document.createElement("option");
                    opt.value = className;
                    opt.textContent = `${className} (${scheduleData[className].tutor})`;
                    s.appendChild(opt.cloneNode(true));
                });
            }
        }

        function renderSchedule() {
            const className = document.getElementById("classSelect").value;
            const data = scheduleData[className];
            if (!data) return;

            document.getElementById("currentClassName").textContent = className;
            document.getElementById("currentTutor").textContent = `導師：${data.tutor}`;

            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = "";

            // 結合作息時間表與課表繪製[span_2](start_span)[span_2](end_span)
            timeSchedule.forEach((item) => {
                let tr = document.createElement("tr");
                let isCurrentPeriod = (currentPeriodObj && currentPeriodObj.name === item.name);
                if (isCurrentPeriod) tr.className = "active-row";

                let tdPeriod = document.createElement("td");
                tdPeriod.className = "period";
                let periodTitle = item.type === 'period' ? `第 ${item.period} 節` : item.name;
                tdPeriod.innerHTML = `${periodTitle} ${isCurrentPeriod ? '<span class="active-tag">進行中</span>' : ''}<span class="time-badge">${item.start} ~ ${item.end}</span>`;
                tr.appendChild(tdPeriod);

                if (item.type === 'event') {
                    let tdEvent = document.createElement("td");
                    tdEvent.colSpan = 5;
                    tdEvent.textContent = item.name;
                    tdEvent.style.color = "#6c757d";
                    tr.appendChild(tdEvent);
                } else {
                    for (let day = 0; day < 5; day++) {
                        let td = document.createElement("td");
                        let subject = data.schedule[item.period - 1][day] || "-";
                        td.textContent = subject;

                        if (isCurrentPeriod && day === currentDayIdx) {
                            td.className = "active-cell";
                            td.innerHTML = `${subject} <br><span class="active-tag">上課中</span>`;
                        }
                        tr.appendChild(td);
                    }
                }
                tableBody.appendChild(tr);
            });
        }

        // 調課提交
        function handleSwapSubmit() {
            const classA = document.getElementById("swapClassA").value;
            const dayA = parseInt(document.getElementById("swapDayA").value);
            const periodA = parseInt(document.getElementById("swapPeriodA").value);

            const classB = document.getElementById("swapClassB").value;
            const dayB = parseInt(document.getElementById("swapDayB").value);
            const periodB = parseInt(document.getElementById("swapPeriodB").value);

            const reason = document.getElementById("swapReason").value || "教務處調課";

            if (swapLessons(classA, dayA, periodA, classB, dayB, periodB, reason)) {
                alert("調課成功！已記錄至調課日誌中。");
                renderSchedule();
            } else {
                alert("調課失敗，請檢查輸入欄位。");
            }
        }

        // 班級新建/修改
        function handleClassSubmit() {
            const name = document.getElementById("newClassName").value.trim();
            const tutor = document.getElementById("newTutorName").value.trim();
            if (!name || !tutor) { alert("請填寫班級名稱與導師姓名"); return; }

            addOrUpdateClass(name, tutor);
            populateSelects();
            alert(`班級 [${name}] 設定成功！`);
        }

        // 渲染調課日誌與作息時間表編輯器
        function renderLogsAndTimeEditor() {
            // 1. 調課日誌
            const logContainer = document.getElementById("logListContainer");
            logContainer.innerHTML = swapLogs.length === 0 ? "<li class='log-item'>尚無調課紀錄</li>" : "";
            swapLogs.forEach(log => {
                let li = document.createElement("li");
                li.className = "log-item";
                li.innerHTML = `<div><strong>${log.detail}</strong></div><div class="log-time">事由：${log.reason} | 時間：${log.timestamp}</div>`;
                logContainer.appendChild(li);
            });

            // 2. 作息編輯
            const timeContainer = document.getElementById("timeScheduleEditor");
            timeContainer.innerHTML = "";
            timeSchedule.forEach((item, idx) => {
                let div = document.createElement("div");
                div.className = "form-group";
                let name = item.type === 'period' ? `第 ${item.period} 節` : item.name;
                div.innerHTML = `
                    <label>${name}：</label>
                    <input type="time" value="${item.start}" id="start_${idx}"> ~
                    <input type="time" value="${item.end}" id="end_${idx}">
                    <button class="btn-primary" style="padding: 4px 10px;" onclick="saveTimeItem(${idx})">儲存</button>
                `;
                timeContainer.appendChild(div);
            });
        }

        function saveTimeItem(idx) {
            const newStart = document.getElementById(`start_${idx}`).value;
            const newEnd = document.getElementById(`end_${idx}`).value;
            updateTimeSchedule(idx, newStart, newEnd);
            alert("作息時間已更新！");
            updateClock();
        }

        function filterClasses() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const select = document.getElementById("classSelect");
            for (let option of select.options) {
                option.style.display = option.textContent.toLowerCase().includes(input) ? "" : "none";
            }
        }

        window.onload = function() {
            populateSelects();
            updateClock();
            setInterval(updateClock, 10000);
        };
    </script>
</body>
</html>
