<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧課表</title>
    <style>
        :root {
            --gov-navy: #1a2b4c;
            --gov-slate: #2c3e50;
            --gov-border: #b2bec3;
            --gov-bg: #f5f6fa;
            --gov-card: #ffffff;
            --gov-accent: #2980b9;
            --gov-active: #d63031;
            --gov-highlight: #fff3bf;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        body { background-color: var(--gov-bg); color: #2d3436; padding: 20px; line-height: 1.5; }

        header {
            background-color: var(--gov-navy);
            color: white;
            padding: 15px 25px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 4px solid var(--gov-accent);
        }

        h1 { font-size: 1.5rem; letter-spacing: 1px; font-weight: 700; }
        .system-time { font-size: 1rem; font-family: "Courier New", monospace; text-align: right; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 3px; }

        /* 導覽頁籤 */
        .nav-tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--gov-slate); margin-bottom: 20px; }
        .tab-btn {
            padding: 8px 20px; background-color: #dfe6e9; border: none; font-weight: bold;
            color: var(--gov-slate); cursor: pointer; border-radius: 4px 4px 0 0; transition: 0.1s;
        }
        .tab-btn.active { background-color: var(--gov-slate); color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel-card {
            background: var(--gov-card); border: 1px solid var(--gov-border);
            border-radius: 4px; padding: 20px; margin-bottom: 20px;
        }
        .panel-title { font-size: 1.1rem; color: var(--gov-navy); font-weight: bold; border-left: 4px solid var(--gov-navy); padding-left: 10px; margin-bottom: 15px; }

        /* 表單區域 */
        .form-row { display: flex; gap: 15px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .form-row label { font-weight: bold; width: 90px; font-size: 0.9rem; }
        select, input, button {
            padding: 6px 12px; font-size: 0.9rem; border: 1px solid var(--gov-border); border-radius: 2px; outline: none;
        }
        button.btn-gov {
            background-color: var(--gov-navy); color: white; border: none; cursor: pointer; font-weight: bold; padding: 8px 16px;
        }
        button.btn-gov:hover { background-color: var(--gov-slate); }
        button.btn-export { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* 表格樣式 */
        .table-container { overflow-x: auto; border: 1px solid var(--gov-border); background: white; }
        table { width: 100%; border-collapse: collapse; text-align: center; min-width: 700px; font-size: 0.9rem; }
        th, td { border: 1px solid var(--gov-border); padding: 10px; }
        th { background-color: #f1f2f6; color: var(--gov-navy); font-weight: bold; }
        td.period-col { background-color: #f8f9fa; font-weight: bold; width: 160px; }
        .time-text { font-size: 0.75rem; color: #636e72; font-weight: normal; display: block; }

        /* 當前上課高亮 */
        .active-period { background-color: var(--gov-highlight) !important; font-weight: bold; }
        .active-tag { background-color: var(--gov-active); color: white; font-size: 0.7rem; padding: 1px 4px; border-radius: 2px; margin-left: 4px; }

        /* 文字日誌區塊 */
        .log-box {
            width: 100%; height: 200px; background-color: #2d3436; color: #76ff03;
            font-family: "Courier New", monospace; padding: 10px; border-radius: 2px;
            overflow-y: scroll; font-size: 0.85rem; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>國立東港海事 - 教務處調課與課表管理系統</h1>
        </div>
        <div class="system-time">
            <div>國家標準時間 (UTC+8)</div>
            <div id="taipeiClock" style="font-size: 1.2rem; font-weight: bold; color: #00cec9;">0000-00-00 00:00:00</div>
        </div>
    </header>

    <!-- 頁籤導覽 -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('viewTab')">班級總課表</button>
        <button class="tab-btn" onclick="switchTab('swapTab')">線上調課申請</button>
        <button class="tab-btn" onclick="switchTab('classTab')">班級維護</button>
        <button class="tab-btn" onclick="switchTab('logTab')">調課日誌與備份</button>
    </div>

    <!-- TAB 1: 課表查詢 -->
    <div id="viewTab" class="tab-content active">
        <div class="panel-card" style="padding: 12px;">
            <div class="form-row" style="margin:0;">
                <label>選擇班級：</label>
                <select id="classSelect" onchange="renderSchedule()"></select>
                <input type="text" id="searchInput" placeholder="關鍵字搜尋..." oninput="filterClasses()">
            </div>
        </div>

        <div class="panel-card" style="padding: 0;">
            <div style="background: var(--gov-slate); color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between;">
                <span id="currentClassName">班級名稱</span>
                <span id="currentTutor">導師：-</span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>節次 / 時間</th>
                            <th>星期一</th>
                            <th>星期二</th>
                            <th>星期三</th>
                            <th>星期四</th>
                            <th>星期五</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB 2: 調課申請 -->
    <div id="swapTab" class="tab-content">
        <div class="panel-card">
            <div class="panel-title">教務處課務對調執行作業</div>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px;">
                <!-- 標的 A -->
                <div style="flex: 1; border: 1px solid var(--gov-border); padding: 15px; background: #fafafa;">
                    <strong style="color: var(--gov-navy);">【標的 A】</strong>
                    <div class="form-row" style="margin-top:10px;"><label>班級：</label><select id="swapClassA"></select></div>
                    <div class="form-row"><label>星期：</label>
                        <select id="swapDayA">
                            <option value="0">星期一</option><option value="1">星期二</option>
                            <option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option>
                        </select>
                    </div>
                    <div class="form-row"><label>節次：</label>
                        <select id="swapPeriodA">
                            <option value="1">第 1 節</option><option value="2">第 2 節</option><option value="3">第 3 節</option>
                            <option value="4">第 4 節</option><option value="5">第 5 節</option><option value="6">第 6 節</option><option value="7">第 7 節</option>
                        </select>
                    </div>
                </div>

                <!-- 標的 B -->
                <div style="flex: 1; border: 1px solid var(--gov-border); padding: 15px; background: #fafafa;">
                    <strong style="color: var(--gov-navy);">【標的 B】</strong>
                    <div class="form-row" style="margin-top:10px;"><label>班級：</label><select id="swapClassB"></select></div>
                    <div class="form-row"><label>星期：</label>
                        <select id="swapDayB">
                            <option value="0">星期一</option><option value="1">星期二</option>
                            <option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option>
                        </select>
                    </div>
                    <div class="form-row"><label>節次：</label>
                        <select id="swapPeriodB">
                            <option value="1">第 1 節</option><option value="2">第 2 節</option><option value="3">第 3 節</option>
                            <option value="4">第 4 節</option><option value="5">第 5 節</option><option value="6">第 6 節</option><option value="7">第 7 節</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label>調課事由：</label>
                <input type="text" id="swapReason" placeholder="請輸入簽核事由（如：教師公差）" style="flex:1;">
            </div>
            <button class="btn-gov" style="width: 100%; margin-top: 10px;" onclick="handleSwapSubmit()">執行調課登記</button>
        </div>
    </div>

    <!-- TAB 3: 班級維護 -->
    <div id="classTab" class="tab-content">
        <div class="panel-card">
            <div class="panel-title">全校班級資料建置</div>
            <div class="form-row">
                <label>班級代號：</label>
                <input type="text" id="newClassName" placeholder="如：電一甲">
            </div>
            <div class="form-row">
                <label>導師姓名：</label>
                <input type="text" id="newTutorName" placeholder="如：李怡蓉">
            </div>
            <button class="btn-gov" onclick="handleClassSubmit()">確認儲存</button>
        </div>
    </div>

    <!-- TAB 4: 日誌與備份 -->
    <div id="logTab" class="tab-content">
        <div class="panel-card">
            <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span>調課紀錄稽核日誌 (Audit Log)</span>
                <button class="btn-export" onclick="exportLogFile()">匯出文字日誌 (.txt)</button>
            </div>
            <div class="log-box" id="logBox">無紀錄</div>
        </div>
    </div>

    <script src="curriculum.js"></script>
    <script>
        // HTML 內建預設定義 - 東港海事學生生活作息時間表[span_2](start_span)[span_2](end_span)
        const timeSchedule = [
            { type: 'event', name: '自主學習/升旗', start: '07:50', end: '08:10' },
            { type: 'period', period: 1, name: '第一節', start: '08:10', end: '09:00' },
            { type: 'period', period: 2, name: '第二節', start: '09:10', end: '10:00' },
            { type: 'period', period: 3, name: '第三節', start: '10:10', end: '11:00' },
            { type: 'period', period: 4, name: '第四節', start: '11:10', end: '12:00' },
            { type: 'event', name: '午餐時間', start: '12:00', end: '12:25' },
            { type: 'event', name: '整理環境', start: '12:25', end: '12:45' },
            { type: 'event', name: '午休時間', start: '12:45', end: '13:15' },
            { type: 'period', period: 5, name: '第五節', start: '13:20', end: '14:10' },
            { type: 'period', period: 6, name: '第六節', start: '14:20', end: '15:10' },
            { type: 'period', period: 7, name: '第七節', start: '15:20', end: '16:10' }
        ];

        let currentDayIdx = new Date().getDay() - 1;
        let currentPeriodObj = null;

        // 國家標準時間 (台北標準時間) 時鐘機制
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById("taipeiClock").textContent = `${year}-${month}-${date} ${hours}:${minutes}:${seconds}`;

            const currentTime = `${hours}:${minutes}`;
            currentPeriodObj = null;

            for (let item of timeSchedule) {
                if (currentTime >= item.start && currentTime < item.end) {
                    currentPeriodObj = item;
                    break;
                }
            }
            renderSchedule();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'logTab') renderLogBox();
        }

        function populateSelects() {
            const selects = [document.getElementById("classSelect"), document.getElementById("swapClassA"), document.getElementById("swapClassB")];
            selects.forEach(s => s.innerHTML = "");

            for (let className in scheduleData) {
                selects.forEach(s => {
                    let opt = document.createElement("option");
                    opt.value = className;
                    opt.textContent = `${className} (${scheduleData[className].tutor})`;
                    s.appendChild(opt.cloneNode(true));
                });
            }
        }

        function renderSchedule() {
            const className = document.getElementById("classSelect").value;
            const data = scheduleData[className];
            if (!data) return;

            document.getElementById("currentClassName").textContent = `班級：${className}`;
            document.getElementById("currentTutor").textContent = `導師：${data.tutor}`;

            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = "";

            timeSchedule.forEach((item) => {
                let tr = document.createElement("tr");
                let isCurrentPeriod = (currentPeriodObj && currentPeriodObj.name === item.name);

                let tdPeriod = document.createElement("td");
                tdPeriod.className = "period-col";
                let titleText = item.type === 'period' ? `第 ${item.period} 節` : item.name;
                tdPeriod.innerHTML = `${titleText} ${isCurrentPeriod ? '<span class="active-tag">進行中</span>' : ''}<span class="time-text">${item.start} - ${item.end}</span>`;
                tr.appendChild(tdPeriod);

                if (item.type === 'event') {
                    let tdEvent = document.createElement("td");
                    tdEvent.colSpan = 5;
                    tdEvent.textContent = item.name;
                    tdEvent.style.color = "#a4b0be";
                    tr.appendChild(tdEvent);
                } else {
                    for (let day = 0; day < 5; day++) {
                        let td = document.createElement("td");
                        let subject = data.schedule[item.period - 1][day] || "-";
                        td.textContent = subject;

                        if (isCurrentPeriod && day === currentDayIdx) {
                            td.className = "active-period";
                        }
                        tr.appendChild(td);
                    }
                }
                tableBody.appendChild(tr);
            });
        }

        function handleSwapSubmit() {
            const classA = document.getElementById("swapClassA").value;
            const dayA = parseInt(document.getElementById("swapDayA").value);
            const periodA = parseInt(document.getElementById("swapPeriodA").value);

            const classB = document.getElementById("swapClassB").value;
            const dayB = parseInt(document.getElementById("swapDayB").value);
            const periodB = parseInt(document.getElementById("swapPeriodB").value);

            const reason = document.getElementById("swapReason").value;

            if (swapLessons(classA, dayA, periodA, classB, dayB, periodB, reason)) {
                alert("【成功】對調作業執行完畢，已寫入系統日誌。");
                renderSchedule();
            }
        }

        function handleClassSubmit() {
            const name = document.getElementById("newClassName").value.trim();
            const tutor = document.getElementById("newTutorName").value.trim();
            if (!name || !tutor) { alert("請完整填寫欄位"); return; }

            addOrUpdateClass(name, tutor);
            populateSelects();
            alert(`【完成】班級 [${name}] 設定完畢。`);
        }

        function renderLogBox() {
            const logBox = document.getElementById("logBox");
            if (swapLogs.length === 0) {
                logBox.textContent = "[SYSTEM LOG] 尚無任何調課變更紀錄。";
                return;
            }

            let text = "=== 國立東港海事 教務處調課變更日誌 ===\n\n";
            swapLogs.forEach((log, index) => {
                text += `[紀錄 #${swapLogs.length - index}] ${log.timestamp}\n`;
                text += `  對調細節: ${log.detail}\n`;
                text += `  核准事由: ${log.reason}\n`;
                text += `--------------------------------------------------\n`;
            });
            logBox.textContent = text;
        }

        // 匯出 TXT 文字檔案
        function exportLogFile() {
            if (swapLogs.length === 0) {
                alert("目前無可供匯出的日誌紀錄。");
                return;
            }

            let fileContent = "國立東港海事 教務處調課變更紀錄表\n";
            fileContent += "匯出時間: " + document.getElementById("taipeiClock").textContent + "\n";
            fileContent += "==================================================\n\n";

            swapLogs.forEach((log, index) => {
                fileContent += `紀錄編號: #${swapLogs.length - index}\n`;
                fileContent += `異動時間: ${log.timestamp}\n`;
                fileContent += `異動內容: ${log.detail}\n`;
                fileContent += `事由說明: ${log.reason}\n`;
                fileContent += "--------------------------------------------------\n";
            });

            const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `調課日誌_${new Date().toISOString().slice(0,10)}.txt`;
            link.click();
        }

        function filterClasses() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const select = document.getElementById("classSelect");
            for (let option of select.options) {
                option.style.display = option.textContent.toLowerCase().includes(input) ? "" : "none";
            }
        }

        window.onload = function() {
            populateSelects();
            updateClock();
            setInterval(updateClock, 1000); // 每一秒更新一次台北標準時間
        };
    </script>
</body>
</html>
