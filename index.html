        :root {
            --primary-color: #0056b3;
            --secondary-color: #e9ecef;
            --border-color: #dee2e6;
            --text-color: #212529;
            --card-bg: #ffffff;
            --accent-bg: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: var(--text-color);
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #6c757d;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        select, input {
            padding: 10px 15px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background-color: #fff;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(0,86,179,.25);
        }

        .class-info {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 電腦端表格樣式 */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 600px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--secondary-color);
            color: #495057;
            font-weight: 600;
        }

        td.period {
            background-color: var(--accent-bg);
            font-weight: bold;
            width: 80px;
        }

        /* 手機端卡片樣式 */
        .mobile-schedule {
            display: none;
            flex-direction: column;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .day-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .day-title {
            background-color: var(--secondary-color);
            padding: 8px 12px;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .period-list {
            list-style: none;
        }

        .period-item {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .period-item:last-child {
            border-bottom: none;
        }

        .period-num {
            color: #6c757d;
            font-weight: bold;
            margin-right: 10px;
        }

        /* 響應式切換：螢幕寬度小於 768px 時自動使用卡片排版 */
        @media (max-width: 767px) {
            .desktop-table {
                display: none;
            }
            .mobile-schedule {
                display: flex;
            }
        }
    </style>
</head>

        // 初始化選單
        function initSelectOptions() {
            const select = document.getElementById("classSelect");
            select.innerHTML = "";
            for (let className in scheduleData) {
                let option = document.createElement("option");
                option.value = className;
                option.textContent = `${className} (${scheduleData[className].tutor})`;
                select.appendChild(option);
            }
            renderSchedule();
        }

        // 搜尋過濾班級
        function filterClasses() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const select = document.getElementById("classSelect");
            let firstMatch = null;

            for (let i = 0; i < select.options.length; i++) {
                const text = select.options[i].textContent.toLowerCase();
                if (text.includes(input)) {
                    select.options[i].style.display = "";
                    if (!firstMatch) firstMatch = select.options[i].value;
                } else {
                    select.options[i].style.display = "none";
                }
            }

            if (firstMatch) {
                select.value = firstMatch;
                renderSchedule();
            }
        }

        // 繪製課表（電腦版表格 + 手機版卡片）
        function renderSchedule() {
            const className = document.getElementById("classSelect").value;
            const data = scheduleData[className];
            if (!data) return;

            document.getElementById("currentClassName").textContent = className;
            document.getElementById("currentTutor").textContent = `導師：${data.tutor}`;

            // 1. 繪製電腦版表格
            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = "";
            for (let period = 0; period < 7; period++) {
                let tr = document.createElement("tr");
                let tdPeriod = document.createElement("td");
                tdPeriod.className = "period";
                tdPeriod.textContent = `第 ${period + 1} 節`;
                tr.appendChild(tdPeriod);

                for (let day = 0; day < 5; day++) {
                    let td = document.createElement("td");
                    td.textContent = data.schedule[period][day] || "-";
                    tr.appendChild(td);
                }
                tableBody.appendChild(tr);
            }

            // 2. 繪製手機版卡片
            const mobileList = document.getElementById("mobileList");
            mobileList.innerHTML = "";
            const daysText = ["星期一", "星期二", "星期三", "星期四", "星期五"];

            for (let day = 0; day < 5; day++) {
                let dayCard = document.createElement("div");
                dayCard.className = "day-card";

                let dayTitle = document.createElement("div");
                dayTitle.className = "day-title";
                dayTitle.textContent = daysText[day];
                dayCard.appendChild(dayTitle);

                let periodList = document.createElement("ul");
                periodList.className = "period-list";

                for (let period = 0; period < 7; period++) {
                    let item = document.createElement("li");
                    item.className = "period-item";
                    
                    let subject = data.schedule[period][day] || "-";
                    item.innerHTML = `<span class="period-num">第 ${period + 1} 節</span><span>${subject}</span>`;
                    periodList.appendChild(item);
                }

                dayCard.appendChild(periodList);
                mobileList.appendChild(dayCard);
            }
        }

        // 初始化頁面
        window.onload = initSelectOptions;
    </script>
